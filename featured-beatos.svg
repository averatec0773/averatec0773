<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="50%" stop-color="#1f1247"/>
      <stop offset="100%" stop-color="#0a1d3a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="80%" stop-color="#f472b6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="16" fill="url(#bg)"/>
  <ellipse cx="440" cy="240" rx="440" ry="180" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="880" y2="125"/>
    <line x1="0" y1="375" x2="880" y2="375"/>
    <line x1="220" y1="0" x2="220" y2="500"/>
    <line x1="660" y1="0" x2="660" y2="500"/>
  </g>

  <!-- Traffic lights (desktop app cue) -->
  <g transform="translate(40, 40)">
    <circle cx="0"  cy="0" r="6.5" fill="#ff5f57" opacity="0.9"/>
    <circle cx="22" cy="0" r="6.5" fill="#febc2e" opacity="0.9"/>
    <circle cx="44" cy="0" r="6.5" fill="#28c840" opacity="0.9"/>
  </g>

  <!-- Active pill (top-right) -->
  <g transform="translate(752, 28)">
    <rect width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"
          stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17.5"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="11" font-weight="700" letter-spacing="1" fill="#ffffff">ACTIVE</text>
  </g>

  <!-- Wordmark -->
  <text x="440" y="248" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="112" font-weight="800" letter-spacing="-4" fill="#ffffff">BeatOS</text>

  <!-- Subtitle -->
  <text x="440" y="295" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="4" fill="#c4b5fd">BEAT PRODUCER&#8217;S OS &#160;·&#160; MCP-NATIVE</text>

  <!-- Waveform accent -->
  <g transform="translate(240, 410)">
    <rect x="0"   y="-4"  width="6" height="8"  rx="3" fill="url(#wave)"/>
    <rect x="10"  y="-6"  width="6" height="12" rx="3" fill="url(#wave)"/>
    <rect x="20"  y="-5"  width="6" height="10" rx="3" fill="url(#wave)"/>
    <rect x="30"  y="-8"  width="6" height="16" rx="3" fill="url(#wave)"/>
    <rect x="40"  y="-7"  width="6" height="14" rx="3" fill="url(#wave)"/>
    <rect x="50"  y="-10" width="6" height="20" rx="3" fill="url(#wave)"/>
    <rect x="60"  y="-8"  width="6" height="16" rx="3" fill="url(#wave)"/>
    <rect x="70"  y="-12" width="6" height="24" rx="3" fill="url(#wave)"/>
    <rect x="80"  y="-10" width="6" height="20" rx="3" fill="url(#wave)"/>
    <rect x="90"  y="-14" width="6" height="28" rx="3" fill="url(#wave)"/>
    <rect x="100" y="-12" width="6" height="24" rx="3" fill="url(#wave)"/>
    <rect x="110" y="-16" width="6" height="32" rx="3" fill="url(#wave)"/>
    <rect x="120" y="-14" width="6" height="28" rx="3" fill="url(#wave)"/>
    <rect x="130" y="-18" width="6" height="36" rx="3" fill="url(#wave)"/>
    <rect x="140" y="-16" width="6" height="32" rx="3" fill="url(#wave)"/>
    <rect x="150" y="-20" width="6" height="40" rx="3" fill="url(#wave)"/>
    <rect x="160" y="-18" width="6" height="36" rx="3" fill="url(#wave)"/>
    <rect x="170" y="-21" width="6" height="42" rx="3" fill="url(#wave)"/>
    <rect x="180" y="-19" width="6" height="38" rx="3" fill="url(#wave)"/>
    <rect x="190" y="-22" width="6" height="44" rx="3" fill="url(#wave)"/>
    <rect x="200" y="-20" width="6" height="40" rx="3" fill="url(#wave)"/>
    <rect x="210" y="-21" width="6" height="42" rx="3" fill="url(#wave)"/>
    <rect x="220" y="-19" width="6" height="38" rx="3" fill="url(#wave)"/>
    <rect x="230" y="-20" width="6" height="40" rx="3" fill="url(#wave)"/>
    <rect x="240" y="-18" width="6" height="36" rx="3" fill="url(#wave)"/>
    <rect x="250" y="-19" width="6" height="38" rx="3" fill="url(#wave)"/>
    <rect x="260" y="-16" width="6" height="32" rx="3" fill="url(#wave)"/>
    <rect x="270" y="-17" width="6" height="34" rx="3" fill="url(#wave)"/>
    <rect x="280" y="-14" width="6" height="28" rx="3" fill="url(#wave)"/>
    <rect x="290" y="-15" width="6" height="30" rx="3" fill="url(#wave)"/>
    <rect x="300" y="-12" width="6" height="24" rx="3" fill="url(#wave)"/>
    <rect x="310" y="-13" width="6" height="26" rx="3" fill="url(#wave)"/>
    <rect x="320" y="-10" width="6" height="20" rx="3" fill="url(#wave)"/>
    <rect x="330" y="-11" width="6" height="22" rx="3" fill="url(#wave)"/>
    <rect x="340" y="-8"  width="6" height="16" rx="3" fill="url(#wave)"/>
    <rect x="350" y="-9"  width="6" height="18" rx="3" fill="url(#wave)"/>
    <rect x="360" y="-6"  width="6" height="12" rx="3" fill="url(#wave)"/>
    <rect x="370" y="-7"  width="6" height="14" rx="3" fill="url(#wave)"/>
    <rect x="380" y="-4"  width="6" height="8"  rx="3" fill="url(#wave)"/>
    <rect x="390" y="-5"  width="6" height="10" rx="3" fill="url(#wave)"/>
  </g>
</svg>
